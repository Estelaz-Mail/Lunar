name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}

      - name: Tests
        run: LUA=lua${{ matrix.lua }} bin/lunar spec

      - name: Every component compiles
        run: LUA=lua${{ matrix.lua }} bin/lunar build examples/tranquility

      - name: The route table is discoverable
        run: LUA=lua${{ matrix.lua }} bin/lunar map examples/tranquility

      - name: Nothing was generated into the repository
        run: git diff --exit-code && git status --porcelain --untracked-files=all | tee /dev/stderr | (! grep .)

  browser-runtime:
    name: Browser runtime CSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install site tooling
        run: bun install --frozen-lockfile --cwd website
      - name: Package the site
        run: bun run --cwd website build
      - name: Strict TypeScript
        run: bun run --cwd website typecheck
      - name: Lua, host bridge and installer tests
        run: bun test spec/*.test.ts website/worker/*.test.ts

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Measure
        run: bin/lunar bench examples/tranquility

  install:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lua, without LuaSocket
        run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev
      - name: Install from this checkout
        run: |
          sh install.sh --from . --prefix "$RUNNER_TEMP/lunar" \
            --bin-dir "$RUNNER_TEMP/bin" --no-modify-path
      - name: The launcher runs
        run: |
          "$RUNNER_TEMP/bin/lunar" help
      - name: The suite passes through it
        working-directory: ${{ runner.temp }}/lunar/current
        run: |
          "$RUNNER_TEMP/bin/lunar" spec
      - name: And it serves, which is what LuaSocket was for
        working-directory: ${{ runner.temp }}/lunar/current
        run: |
          PORT=3123 "$RUNNER_TEMP/bin/lunar" dev examples/tranquility &
          server=$!
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:3123/ && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:3123/ | grep -q "A framework in Lua"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3123/blog/why-lua | grep -q 200
          kill "$server"
      - name: And it comes out again
        run: |
          sh install.sh --uninstall --prefix "$RUNNER_TEMP/lunar" --bin-dir "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/lunar"

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Prettier
        run: bin/lunar fmt --check .

  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: editors/vscode
        run: bun install
      - name: Grammar, manifest and tokens
        working-directory: editors/vscode
        run: bun run check
